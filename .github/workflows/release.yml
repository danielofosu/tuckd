name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          mkdir -p dist
          zip -r "dist/tuckd-${{ steps.version.outputs.version }}.zip" \
            manifest.json \
            background.js \
            popup.html popup.js popup.css \
            settings.html settings.js settings.css \
            archive.html archive.js archive.css \
            command-bar.js command-bar.css \
            icons/ \
            LICENSE \
            -x '*.DS_Store'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/tuckd-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
